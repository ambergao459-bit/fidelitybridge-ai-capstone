services:
  - type: web
    name: fidelitybridge-ai
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: MAX_CHARS_FOR_LLM
        value: "45000"
      - key: OPENAI_API_KEY
        sync: false
